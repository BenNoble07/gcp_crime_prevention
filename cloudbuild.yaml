steps:
  # Step 1: Upload your Airflow DAG to Cloud Composer
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'storage'
      - 'cp'
      - 'spark_dag.py'
      - 'gs://${_DAGS_BUCKET}/dags/spark_dag.py'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DAGS_BUCKET: "us-central1-bankcrimeflow-c57f7f77-bucket"
